<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tell your story. · Borough</title>
  </head>
  <body>
    <header id="header"></header>
    <main id="main" class="container page">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Workspace / Business editor</p>
          <h1>Make a great first impression.</h1>
        </div>
        <a class="btn btn-outline-dark" href="/owner.html"
          >Back to businesses</a
        >
      </div>
      <p>New listings and edits are reviewed before publication.</p>
      <p id="status" role="status"></p>
      <form id="editor" class="business-editor"></form>
      <section id="file-section" class="surface upload-panel mt-4" hidden>
        <h2>Photos and documents</h2>
        <div id="files"></div>
        <form id="upload">
          <label for="file" class="form-label"
            >JPG, PNG, WebP or PDF · Maximum 10 MB</label
          ><input
            type="file"
            name="file"
            id="file"
            class="form-control"
            accept="image/jpeg,image/png,image/webp,application/pdf"
            required
          /><button class="btn btn-dark mt-3">Upload file</button>
        </form>
      </section>
      <button id="delete" class="btn btn-outline-danger mt-5" hidden>
        Delete business
      </button>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="/src/pages/editor.js"></script>
  </body>
</html>
