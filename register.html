<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Discover independent businesses in your neighbourhood with Borough."
    />
    <title>Borough</title>
  </head>
  <body>
    <header id="header"></header>
    <main id="main" class="container">
      <section class="page auth mx-auto">
        <p class="eyebrow">Your local connection</p>
        <h1>Join Borough.</h1>
        <form method="post">
          <label for="email" class="form-label">Email address</label
          ><input
            class="form-control"
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          /><label for="password" class="form-label">Password</label
          ><input
            class="form-control"
            type="password"
            id="password"
            name="password"
            minlength="12"
            autocomplete="new-password"
            required
          /><button class="btn btn-dark mt-4" disabled>Create account ↗</button>
        </form>
        <p id="status" role="status" class="mt-3">
          Loading secure sign-in form...
        </p>
        <noscript>Please enable JavaScript to use this form.</noscript>
        <a href="/signin.html">Already registered? Sign in</a>
      </section>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="/src/pages/auth.js"></script>
  </body>
</html>
