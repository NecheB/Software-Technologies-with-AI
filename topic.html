<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Discussion - Borough</title>
  </head>
  <body>
    <header id="header"></header>
    <main id="main" class="container page">
      <nav class="forum-breadcrumb" aria-label="Breadcrumb">
        <a href="/community.html">Community forum</a> / Discussion
      </nav>
      <p id="status" role="status"></p>
      <section id="topic"></section>
      <div class="forum-toolbar mt-4">
        <h2>Replies</h2>
        <span id="reply-total"></span>
      </div>
      <div id="posts"></div>
      <div class="forum-pagination">
        <button id="previous" class="btn btn-outline-dark" disabled>
          Previous</button
        ><span id="page-number">Page 1</span
        ><button id="next" class="btn btn-outline-dark" disabled>Next</button>
      </div>
      <section class="compose-panel">
        <div>
          <p class="eyebrow">Add your voice</p>
          <h2>Keep the conversation going.</h2>
          <p>Replies are reviewed before they appear publicly.</p>
        </div>
        <form id="reply">
          <label class="form-label" for="body">Your reply</label
          ><textarea
            class="form-control"
            id="body"
            name="body"
            rows="5"
            minlength="2"
            maxlength="5000"
            required
          ></textarea
          ><button class="btn btn-dark mt-3" disabled>Submit reply</button>
          <p id="reply-status" role="status"></p>
        </form>
      </section>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="/src/pages/topic.js"></script>
  </body>
</html>
