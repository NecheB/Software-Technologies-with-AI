<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Discover local places - Borough</title>
  </head>
  <body class="directory-page">
    <header id="header"></header>
    <main id="main" class="container">
      <section class="directory-intro">
        <div>
          <p class="eyebrow">THE NEIGHBOURHOOD GUIDE</p>
          <h1>Good places.<br /><em>Great discoveries.</em></h1>
          <p>
            Independent businesses, local favourites and something a little
            unexpected.
          </p>
        </div>
        <img
          src="/images/neighbourhood.svg"
          alt="Illustrated local shops"
          width="900"
          height="760"
        />
      </section>
      <form id="search" class="directory-search">
        <div class="directory-searchbar">
          <div>
            <i class="bi bi-search"></i
            ><label class="visually-hidden" for="q">Search businesses</label
            ><input
              id="q"
              name="q"
              placeholder="What would you like to discover?"
            />
          </div>
          <div>
            <i class="bi bi-geo-alt"></i
            ><label class="visually-hidden" for="city">Town or city</label
            ><input id="city" name="city" placeholder="Town or city" />
          </div>
          <button class="btn btn-dark">
            Find my local <i class="bi bi-arrow-right"></i>
          </button>
        </div>
        <details class="directory-filter-panel" open>
          <summary><i class="bi bi-sliders2"></i> Refine your search</summary>
          <div class="directory-filter-fields">
            <div>
              <label for="category" class="form-label">Category</label
              ><select name="category" id="category" class="form-select">
                <option value="">All categories</option>
              </select>
            </div>
            <div>
              <label for="price" class="form-label">Price range</label
              ><select name="price" id="price" class="form-select">
                <option value="">Any budget</option>
                <option value="1">&#163; - Budget friendly</option>
                <option value="2">&#163;&#163; - Moderate</option>
                <option value="3">&#163;&#163;&#163; - Premium</option>
                <option value="4">&#163;&#163;&#163;&#163; - Luxury</option>
              </select>
            </div>
            <div>
              <label for="rating" class="form-label">Minimum rating</label
              ><select name="rating" id="rating" class="form-select">
                <option value="">All ratings</option>
                <option value="3">3+ stars</option>
                <option value="4">4+ stars</option>
                <option value="5">5 stars</option>
              </select>
            </div>
            <button type="button" id="clear" class="btn btn-link">
              Clear filters
            </button>
          </div>
        </details>
      </form>
      <section class="directory-list">
        <div class="directory-results-heading">
          <div>
            <h2>Explore the neighbourhood</h2>
            <p id="status" role="status" aria-live="polite"></p>
          </div>
          <div class="directory-sort">
            <label for="sort">Sort by</label
            ><select id="sort" name="sort" form="search" class="form-select">
              <option value="newest">Newest additions</option>
              <option value="rating">Highest rated</option>
              <option value="name">Name A-Z</option>
            </select>
          </div>
        </div>
        <div id="results" class="business-grid"></div>
        <div class="directory-pagination">
          <button id="previous" class="btn btn-outline-dark" disabled>
            Previous</button
          ><span id="page-number">Page 1</span
          ><button id="next" class="btn btn-outline-dark" disabled>Next</button>
        </div>
      </section>
      <aside class="directory-invite">
        <div>
          <h2>Is your business missing?</h2>
          <p>Help your neighbours find what makes you special.</p>
        </div>
        <a href="/editor.html" class="btn btn-dark"
          >Add your business <i class="bi bi-plus-lg"></i
        ></a>
      </aside>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="/src/pages/directory.js"></script>
  </body>
</html>
