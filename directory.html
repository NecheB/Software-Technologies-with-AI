<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Discover independent businesses in your neighbourhood with Borough."><title>Borough</title></head><body><header id="header"></header><main id="main" class="container"><section class="page"><p class="eyebrow">The local directory</p><h1>Find your kind of place.</h1><form id="search" class="search-panel row g-3"><div class="col-md-4"><label for="q" class="form-label">Keyword</label><input class="form-control" name="q" id="q" placeholder="Coffee, flowers, repairs?"></div><div class="col-md-4"><label for="category" class="form-label">Category</label><select class="form-select" id="category" name="category"><option value="">All categories</option></select></div><div class="col-md-4"><label for="city" class="form-label">Town or city</label><input class="form-control" id="city" name="city"></div><div class="col-md-4"><label for="price" class="form-label">Price</label><select class="form-select" id="price" name="price"><option value="">Any price</option><option value="1">?</option><option value="2">??</option><option value="3">???</option><option value="4">????</option></select></div><div class="col-md-4"><label for="sort" class="form-label">Sort by</label><select class="form-select" id="sort" name="sort"><option value="newest">Newest</option><option value="name">Name</option></select></div><div class="col-md-4 d-flex align-items-end"><button class="btn btn-dark">Find places ?</button></div></form><p id="status" role="status" aria-live="polite"></p><div id="results" class="row g-4"></div><div class="d-flex gap-3 mt-4"><button id="previous" class="btn btn-outline-dark" disabled>Previous</button><button id="next" class="btn btn-outline-dark" disabled>Next</button></div></section></main><footer id="footer"></footer><script type="module" src="/src/pages/directory.js"></script></body></html>
