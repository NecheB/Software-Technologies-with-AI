<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset your password. ? Borough</title></head><body><header id="header"></header><main id="main" class="container page"><h1>Reset your password.</h1><p id="status" role="status"></p><form id="request" class="auth"><label class="form-label" for="email">Email</label><input class="form-control" type="email" name="email" id="email" autocomplete="email" required><button class="btn btn-dark mt-3">Send reset link</button></form><form id="change" class="auth" hidden><label class="form-label" for="password">New password (at least 12 characters)</label><input class="form-control" type="password" name="password" id="password" minlength="12" autocomplete="new-password" required><button class="btn btn-dark mt-3">Save password</button></form></main><footer id="footer"></footer><script type="module" src="/src/pages/reset.js"></script></body></html>
