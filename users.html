<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>People and permissions. · Borough</title>
  </head>
  <body>
    <header id="header"></header>
    <main id="main" class="container page">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Management / People</p>
          <h1>People &amp; permissions</h1>
          <p>Find a member, manage access and keep your community safe.</p>
        </div>
        <span class="step-chip">MEMBER DIRECTORY</span>
      </div>
      <nav id="staff-nav" class="mb-4" aria-label="Staff tools"></nav>
      <p id="status" role="status"></p>
      <section class="surface">
        <form id="people-search" class="table-toolbar">
          <div class="search-with-icon">
            <i class="bi bi-search"></i
            ><label class="visually-hidden" for="member-query"
              >Search by name or exact member ID</label
            ><input
              id="member-query"
              class="form-control"
              placeholder="Search name or exact member ID..."
            />
          </div>
          <label class="visually-hidden" for="member-role">Role</label
          ><select id="member-role" class="form-select">
            <option value="">All roles</option>
            <option>user</option>
            <option>owner</option>
            <option>moderator</option>
            <option>admin</option></select
          ><button class="btn btn-dark">Search</button>
        </form>
        <div class="table-responsive">
          <table class="table data-table">
            <thead>
              <tr>
                <th>Member</th>
                <th>Location</th>
                <th>Role</th>
                <th>Joined</th>
                <th>Manage</th>
              </tr>
            </thead>
            <tbody id="people"></tbody>
          </table>
        </div>
        <div class="table-pagination">
          <span id="people-count" role="status"></span>
          <div>
            <button
              id="people-prev"
              class="btn btn-outline-dark btn-sm"
              disabled
            >
              Previous</button
            ><button
              id="people-next"
              class="btn btn-outline-dark btn-sm"
              disabled
            >
              Next
            </button>
          </div>
        </div>
      </section>
      <details class="surface restriction-panel mt-4" id="restriction-panel">
        <summary>
          <i class="bi bi-shield-exclamation"></i> Restrictions &amp;
          suspensions <span>Manage access limits</span>
        </summary>
        <div class="restriction-content">
          <h2>Recent restrictions</h2>
          <div id="restrictions"></div>
          <div class="table-pagination">
            <span id="restriction-count"></span>
            <div>
              <button
                id="restriction-prev"
                class="btn btn-sm btn-outline-dark"
                disabled
              >
                Previous</button
              ><button
                id="restriction-next"
                class="btn btn-sm btn-outline-dark"
                disabled
              >
                Next
              </button>
            </div>
          </div>
          <form id="restrict" class="auth" hidden>
            <label class="form-label" for="user_id">User ID</label
            ><input
              class="form-control"
              id="user_id"
              name="user_id"
              required
            /><label class="form-label" for="permission">Restriction</label
            ><select class="form-select" name="permission" id="permission">
              <option>all</option>
              <option>listings.write</option>
              <option>content.write</option>
              <option>files.write</option>
              <option>profile.write</option>
              <option>ads.write</option></select
            ><label class="form-label" for="reason">Reason</label
            ><input
              class="form-control"
              name="reason"
              id="reason"
              minlength="3"
              required
            /><label class="form-label" for="expires_at"
              >Expires (leave blank for permanent)</label
            ><input
              class="form-control"
              type="datetime-local"
              name="expires_at"
              id="expires_at"
            /><button class="btn btn-dark mt-3">Apply restriction</button>
          </form>
        </div>
      </details>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="/src/pages/users.js"></script>
  </body>
</html>
